name = "secure-store"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "secure-store-vault-storage"

# Use Cloudflare Dashboard for production secrets
# Use .dev.vars for local development

[site]
bucket = "./dist"
